version: "3.9"

services:
  backend:
    build:
      context: ./backend
      network: host
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      HOST_DATABASE_DEV: db
    volumes:
      - ./backend/auth:/app/auth
    depends_on:
      db:
        condition: service_healthy
    networks:
      - zenda-network

  frontend:
    build:
      context: ./frontend
      network: host
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    networks:
      - zenda-network

  db:
    image: postgres:16.0
    ports:
      - "${PORT_DATABASE_DEV:-5432}:5432"
    environment:
      POSTGRES_USER: ${USER_DATABASE_DEV:-postgres}
      POSTGRES_PASSWORD: ${PS_DATABASE_DEV:-postgres123}
      POSTGRES_DB: ${DB_DATABASE_DEV:-zendabot_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5
    networks:
      - zenda-network

volumes:
  pgdata:

networks:
  zenda-network:
    driver: bridge
